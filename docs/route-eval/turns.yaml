# Hand-labelled turns for the step 0 route check (t01-t30), plus real turns
# from the shadow log (t31 on). Each turn is something a person might type
# into Claude Code; `route` is the answer the router should give:
#
#   deterministic  code can do it exactly (a swamp extension could run it)
#   decision       a yes/no judgement Jev can answer from the text alone
#   llm            anything else: Claude does the turn
#
# Accuracy is the share of turns where Jev's `choice` matches `route` with
# confidence at or above the cut-off. Turns below the cut-off count as `llm`,
# because that is what the router does with them (fail open).
turns:
  # deterministic
  - id: t01
    text: list the open pull requests in puddle-works/puddleworks
    route: deterministic
  - id: t02
    text: what is the latest published version of @swamp/aws/ec2?
    route: deterministic
  - id: t03
    text: show me the CI status of PR 42 in puddle-works/puddleworks
    route: deterministic
  - id: t04
    text: how many open issues are labelled bug in puddle-works/puddleworks-apps?
    route: deterministic
  - id: t05
    text: is the default branch of puddle-works/puddle-tooling protected?
    route: deterministic
  - id: t06
    text: which swamp extensions have the label github?
    route: deterministic
  - id: t07
    text: when was the last commit on main in puddle-works/puddle-template?
    route: deterministic
  - id: t08
    text: list the hetzner servers in my account
    route: deterministic
  - id: t09
    text: what's the current status of the mted19 server?
    route: deterministic
  - id: t10
    text: show the last five swamp workflow runs that failed
    route: deterministic

  # decision
  - id: t11
    text: "is this a good commit message: 'fix stuff'?"
    route: decision
  - id: t12
    text: "does this sentence read as British English: 'The colour of the organisation's logo'?"
    route: decision
  - id: t13
    text: "should 'retry on 429' be treated as a transient error? yes or no"
    route: decision
  - id: t14
    text: "is 'Add hook for routing prompts' written in the imperative mood?"
    route: decision
  - id: t15
    text: "is this PR title under 70 characters and descriptive: 'puddlerouter: shadow-mode hook and load/reply methods'?"
    route: decision
  - id: t16
    text: "is this error message friendly to a non-technical user: 'ENOENT: no such file or directory'?"
    route: decision
  - id: t17
    text: "is the following a question about billing: 'why was I charged twice this month?'"
    route: decision
  - id: t18
    text: "does this log line indicate an error: 'INFO server started on :8080'?"
    route: decision
  - id: t19
    text: "is 'utilise' plain English, yes or no?"
    route: decision
  - id: t20
    text: "is this variable name descriptive enough: 'x2'?"
    route: decision

  # llm
  - id: t21
    text: refactor the reply method so the hint text comes from a template
    route: llm
  - id: t22
    text: why does this test fail intermittently on CI but pass locally?
    route: llm
  - id: t23
    text: write a README section explaining how to install the hook
    route: llm
  - id: t24
    text: add a create_issue method to the github extension with tests
    route: llm
  - id: t25
    text: explain the difference between a guard and an assert step in swamp workflows
    route: llm
  - id: t26
    text: review the diff on this branch for bugs
    route: llm
  - id: t27
    text: draft an ADR for storing recipes in the swamp registry
    route: llm
  - id: t28
    text: help me plan the next three steps for puddlerouter
    route: llm
  - id: t29
    text: rename sourceRef to turnRef everywhere and update the tests
    route: llm
  - id: t30
    text: summarise what changed in the last week across puddle-works repos and what I should look at first
    route: llm

  # llm: real yes/no questions about the conversation, which Jev can't see.
  # Jev picked decision for each in the shadow log (2026-10-13 to 16), below
  # the cut-off (issue #6). Kept as typed.
  - id: t31
    text: "no - bevause this was an earlier session that also ignored the instruction not to proceed"
    route: llm
  - id: t32
    text: so it's swamp native code?
    route: llm
  - id: t33
    text: I feel like 91 is done no?
    route: llm
  - id: t34
    text: Do you want me to remove the merged step 6 worktree and branch? yes
    route: llm
  - id: t35
    text: so it's not currently looking at what is available in swamp?
    route: llm
  - id: t36
    text: "is it possible to publish using puddleworks?  What is wrong with mesgme plan - Publishing: you still need to choose between upgrading the @mesgme plan or setting visibility: public in manifest.yaml. You also need to either add the CI secrets or leave the publish job failing. Neither blocks the hook."
    route: llm
