name: "@puddleworks/example"
description: Placeholder workflow that greets a name. Replace it with the puddle's own.
version: 1
tags:
  maxReruns: "5"
  maxWallClock: "5m"
inputs:
  type: object
  properties:
    name:
      type: string
      description: Who to greet.
      default: world
  required: []
jobs:
  - name: main
    steps:
      - name: greet
        task:
          type: model_method
          modelIdOrName: example
          methodName: greet
          inputs:
            name: ${{ inputs.name }}
