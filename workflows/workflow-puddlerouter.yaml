id: 9366b226-da00-46dc-9a1c-1e6ad0d4c39d
name: "@puddleworks/puddlerouter"
description: >-
  Route one turn typed into Claude Code. The hook writes the turn to a temp
  file and passes only its path. load cleans and hashes the text, Jev picks a
  route, Jev answers the yes/no question on the decision route, on the
  deterministic route a built-in recipe runs or Jev picks an extension that
  search found, and reply stores what the hook should do. In live mode a
  confident answer blocks the turn with Jev's or the recipe's answer, and a
  deterministic turn nothing can answer raises one GitHub issue (live mode
  only; one per distinct turn). In shadow mode the reply always passes, so the run
  is a log of what live mode would do. The route question must stay the same
  as in puddlerouter-route-eval, and the decision question as in
  puddlerouter-decision-eval.
version: 1
tags:
  maxReruns: "3"
  maxWallClock: "1m"
inputs:
  type: object
  properties:
    turnFile:
      type: string
      description: Path of the temp file holding the turn text.
    mode:
      type: string
      enum: [shadow, live]
      default: shadow
      description: shadow logs the route and always passes; live acts on it.
    cutoff:
      type: number
      default: 0.7
      description: Below this confidence the route is llm.
    answerCutoff:
      type: number
      default: 0.8
      description: >-
        Jev answers yes at a yes probability at or above this, no at or below
        1 minus this; in between Claude answers.
    hookStartedAt:
      type: number
      default: 0
      description: When the hook started, in ms since the epoch; reply records the time since.
    issueRepo:
      type: string
      default: puddle-works/puddleworks-apps
      description: The repo an issue is raised in when nothing can answer a deterministic turn (live mode only).
    repoDir:
      type: string
      default: "."
      description: The runtime swamp repo; recipes pull extensions into it and read its puddlerouter.yaml.
  required: [turnFile]
jobs:
  - name: main
    description: load, route, decide, match, pick, execute, raise, reply.
    dependsOn: []
    weight: 0
    steps:
      - name: load
        description: Read the turn file; store the cleaned text as turn.
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: load
          inputs:
            turnFile: ${{ inputs.turnFile }}
      - name: route
        description: Ask Jev which route the turn should take. Skipped for an empty turn, and for a turn that looks like it holds a secret (never sent to Jev).
        dependsOn:
          - step: load
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
        guard: ${{ steps.load.outputs.empty || steps.load.outputs.withheld }}
        task:
          type: model_method
          modelIdOrName: jev
          methodName: choice
          inputs:
            name: route
            state: ${{ steps.load.outputs.text }}
            instructions: >-
              Route this request typed into a coding assistant. Pick
              deterministic only if a program could answer it exactly by
              calling an API or CLI, with no judgement. Pick decision only if
              it asks for a yes/no judgement about text given in the request.
              Pick llm for anything else, such as writing, changing, reviewing
              or explaining code.
            criteria:
              deterministic: >-
                A program could answer it exactly by calling an API or CLI,
                with no judgement (list, count, look up, show status).
              decision: >-
                It asks for a yes/no judgement about text given in the request.
              llm: >-
                Anything else: writing, changing, reviewing, planning or
                explaining code or documents.
      - name: decide
        description: >-
          Ask Jev the yes/no question in the turn. Skipped unless the route is
          a decision at or above the cut-off and the turn is complete (nothing
          pasted, fenced or cut, so the text to judge is all there).
        dependsOn:
          - step: route
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ !(steps.load.outputs.complete && has(steps.route) &&
          has(steps.route.outputs) && steps.route.outputs.choice == "decision" &&
          steps.route.outputs.confidence >= inputs.cutoff) }}
        task:
          type: model_method
          modelIdOrName: jev
          methodName: noul
          inputs:
            name: decide
            state: ${{ steps.load.outputs.text }}
            instructions: >-
              Answer the yes/no question asked in this request, judging only
              the text given in it.
            yes: The answer to the question is yes.
            no: The answer to the question is no.
      - name: match
        description: >-
          Match a deterministic turn to a built-in recipe, else search for
          extensions. Skipped unless the route is deterministic at or above
          the cut-off.
        dependsOn:
          - step: route
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ !(has(steps.route) && has(steps.route.outputs) &&
          steps.route.outputs.choice == "deterministic" &&
          steps.route.outputs.confidence >= inputs.cutoff) }}
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: match
          inputs:
            text: ${{ steps.load.outputs.text }}
            sourceRef: ${{ steps.load.outputs.sourceRef }}
            repoDir: ${{ inputs.repoDir }}
      - name: pick
        description: >-
          Ask Jev which extension search found, if any, can answer the turn.
          Skipped unless match found candidates.
        dependsOn:
          - step: match
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ !(has(steps.match) && has(steps.match.outputs) &&
          steps.match.outputs.kind == "candidates") }}
        task:
          type: model_method
          modelIdOrName: jev
          methodName: choice
          inputs:
            name: pick
            state: ${{ steps.load.outputs.text }}
            instructions: >-
              Pick the extension that can answer this request exactly by
              calling an API or CLI. Pick none if no candidate can.
            criteria: ${{ steps.match.outputs.criteria }}
      - name: execute
        description: Run the matched recipe. Skipped unless match found a recipe.
        dependsOn:
          - step: match
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ !(has(steps.match) && has(steps.match.outputs) &&
          steps.match.outputs.kind == "recipe") }}
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: execute
          inputs:
            recipeId: ${{ steps.match.outputs.recipeId }}
            captures: ${{ steps.match.outputs.captures }}
            repoDir: ${{ inputs.repoDir }}
      - name: raise
        description: >-
          Raise one GitHub issue (de-duplicated by the turn's sourceRef) for a
          deterministic turn that no recipe or allowlisted extension can
          answer. Live mode only, so shadow mode has no side effects.
        dependsOn:
          - step: match
            condition:
              type: always
          - step: pick
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ !(inputs.mode == "live" && has(steps.match) &&
          has(steps.match.outputs) && steps.match.outputs.kind != "recipe" &&
          !(steps.match.outputs.kind == "candidates" && has(steps.pick) &&
          has(steps.pick.outputs) && steps.pick.outputs.choice != "none" &&
          steps.pick.outputs.confidence >= inputs.cutoff)) }}
        task:
          type: model_method
          modelIdOrName: github
          methodName: create_issue
          inputs:
            repo: ${{ inputs.issueRepo }}
            title: ${{ steps.match.outputs.issueTitle }}
            body: ${{ steps.match.outputs.issueBody }}
            idempotencyKey: ${{ steps.match.outputs.issueKey }}
      - name: reply
        description: Store what the hook should do. Runs whether or not Jev answered.
        dependsOn:
          - step: load
            condition:
              type: succeeded
          - step: route
            condition:
              type: always
          - step: decide
            condition:
              type: always
          - step: pick
            condition:
              type: always
          - step: execute
            condition:
              type: always
          - step: raise
            condition:
              type: always
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: reply
          inputs:
            mode: ${{ inputs.mode }}
            cutoff: ${{ inputs.cutoff }}
            answerCutoff: ${{ inputs.answerCutoff }}
            complete: ${{ steps.load.outputs.complete }}
            hookStartedAt: ${{ inputs.hookStartedAt }}
            sourceRef: ${{ steps.load.outputs.sourceRef }}
            choice: '${{ has(steps.route) && has(steps.route.outputs) ? steps.route.outputs.choice : "" }}'
            confidence: "${{ has(steps.route) && has(steps.route.outputs) ? steps.route.outputs.confidence : 0.0 }}"
            yes: "${{ has(steps.decide) && has(steps.decide.outputs) ? steps.decide.outputs.noul : null }}"
            matchKind: '${{ has(steps.match) && has(steps.match.outputs) ? steps.match.outputs.kind : "none" }}'
            recipeId: '${{ has(steps.match) && has(steps.match.outputs) ? steps.match.outputs.recipeId : "" }}'
            candidates: "${{ has(steps.match) && has(steps.match.outputs) ? steps.match.outputs.candidates : [] }}"
            resultOk: "${{ has(steps.execute) && has(steps.execute.outputs) ? steps.execute.outputs.ok : false }}"
            resultText: '${{ has(steps.execute) && has(steps.execute.outputs) ? steps.execute.outputs.text : "" }}'
            pickChoice: '${{ has(steps.pick) && has(steps.pick.outputs) ? steps.pick.outputs.choice : "" }}'
            pickConfidence: "${{ has(steps.pick) && has(steps.pick.outputs) ? steps.pick.outputs.confidence : 0.0 }}"
            issueUrl: '${{ has(steps.raise) && has(steps.raise.outputs) ? steps.raise.outputs.result : "" }}'
