id: 9366b226-da00-46dc-9a1c-1e6ad0d4c39d
name: "@puddleworks/puddlerouter"
description: >-
  Route one turn typed into Claude Code. The hook writes the turn to a temp
  file and passes only its path. load cleans and hashes the text. alwaysLlm
  sends a phrase listed in puddlerouter.yaml straight to Claude. confirm runs a
  plan the last turn showed if this turn is only a yes, and drops it otherwise.
  @puddleworks/recipes then tries to match a recipe, whatever Jev would say, and
  runs it, or asks first if it makes changes. Only if none matches does Jev pick
  a route and answer the yes/no question on the decision route, and on the
  deterministic route search finds extensions for Jev to pick from. reply stores
  what the hook should do. In live
  mode a confident answer blocks the turn with Jev's or the recipe's answer, and
  a deterministic turn nothing can answer logs one request in Capture (live mode
  only; one per distinct turn). A turn that only says a PR merged skips Jev: the
  merged step checks the PR and its worktree read-only and the reply adds the
  steps to finish as context. A turn that starts with capture: skips Jev and the
  search too: in live mode raise logs it in Capture as typed. In shadow mode the
  reply always passes, so the run is a log of what live mode would do. The route
  question must stay the same as in puddlerouter-route-eval, and the decision
  question as in puddlerouter-decision-eval. split logs what a turn's
  first piece would hit on its own (issue #25); no step reads it.
version: 1
tags:
  maxReruns: "3"
  maxWallClock: "1m"
inputs:
  type: object
  properties:
    turnFile:
      type: string
      description: Path of the temp file holding the turn text.
    mode:
      type: string
      enum: [shadow, live]
      default: shadow
      description: shadow logs the route and always passes; live acts on it.
    cutoff:
      type: number
      default: 0.7
      description: Below this confidence the route is llm.
    answerCutoff:
      type: number
      default: 0.8
      description: >-
        Jev answers yes at a yes probability at or above this, no at or below
        1 minus this; in between Claude answers.
    hookStartedAt:
      type: number
      default: 0
      description: When the hook started, in ms since the epoch; reply records the time since.
    captureUrl:
      type: string
      default: http://127.0.0.1:3002
      description: >-
        Capture's web address, for the link to a logged request. Keep it the
        same as the capture instance's appUrl.
    repoDir:
      type: string
      default: "."
      description: The runtime swamp repo; recipes pull extensions into it and read its puddlerouter.yaml.
    sessionId:
      type: string
      default: ""
      description: >-
        The Claude Code session. A recipe that makes changes keeps its plan
        under it, so only the same session's next turn can confirm it. Empty
        means nothing can be confirmed, so such a recipe does not run.
  required: [turnFile]
jobs:
  - name: main
    description: load, alwaysLlm, recall, confirm, merged, match, split, route, decide, search, pick, execute, raise, reply.
    dependsOn: []
    weight: 0
    steps:
      - name: load
        description: Read the turn file; store the cleaned text as turn.
        dependsOn: []
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: load
          inputs:
            turnFile: ${{ inputs.turnFile }}
      - name: alwaysLlm
        description: >-
          Check the turn against the alwaysLlm list in puddlerouter.yaml. A hit
          goes straight to Claude: only confirm and reply still run. Skipped for
          an empty or withheld turn and a capture: turn, which goes to Capture
          whatever it says. A failure only loses the check.
        dependsOn:
          - step: load
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
        guard: "${{ steps.load.outputs.empty || steps.load.outputs.withheld || steps.load.outputs.capture }}"
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: alwaysLlm
          inputs:
            text: ${{ steps.load.outputs.text }}
            repoDir: ${{ inputs.repoDir }}
      - name: recall
        description: >-
          Read Jev's earlier route, decision and pick for this exact turn from
          the route cache (7 days). Never fails; a miss sets every flag false.
        dependsOn:
          - step: load
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: recall
          inputs:
            sourceRef: ${{ steps.load.outputs.sourceRef }}
      - name: confirm
        description: >-
          If the last turn in this session showed a plan, run it when this turn
          is only a yes and drop it otherwise. A capture: turn or a phrase on
          the alwaysLlm list is never a yes. Skipped in shadow mode, which never
          keeps a plan, and with no session.
        dependsOn:
          - step: load
            condition:
              type: succeeded
          - step: alwaysLlm
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: '${{ inputs.mode != "live" || inputs.sessionId == "" }}'
        task:
          type: model_method
          modelIdOrName: recipes
          methodName: confirm
          inputs:
            sessionId: ${{ inputs.sessionId }}
            text: '${{ steps.load.outputs.capture ? "[capture]" : (has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) && steps.alwaysLlm.outputs.matched) ? "[always-llm]" : steps.load.outputs.text }}'
            repoDir: ${{ inputs.repoDir }}
      - name: merged
        description: >-
          If the turn only says a PR merged ("merged", "12 is merged"), check
          the PR and the worktree it was built in, read-only, and store the
          steps to finish. Jev and the recipes are then skipped. Skipped for an
          empty, withheld or capture: turn, a phrase on the alwaysLlm list and a
          yes confirm handled; a failure only loses the hint.
        dependsOn:
          - step: load
            condition:
              type: succeeded
          - step: alwaysLlm
            condition:
              type: always
          - step: confirm
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: '${{ steps.load.outputs.empty || steps.load.outputs.withheld || steps.load.outputs.capture || (has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) && steps.alwaysLlm.outputs.matched) || (has(steps.confirm) && has(steps.confirm.outputs) && (steps.confirm.outputs.action == "ran" || steps.confirm.outputs.action == "refused")) }}'
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: merged
          inputs:
            text: ${{ steps.load.outputs.text }}
      - name: split
        description: >-
          Cut the turn at commas, "then", sentence ends and spaced dashes, and
          try the first of two or more pieces against the merged phrasing and
          the recipes (match only; issue #25). Logged only: no step reads it.
          Runs after match, so the two never wait on the recipes lock
          together. Skipped for an empty, withheld or capture: turn and a
          phrase on the alwaysLlm list.
        dependsOn:
          - step: load
            condition:
              type: succeeded
          - step: alwaysLlm
            condition:
              type: always
          - step: match
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: '${{ steps.load.outputs.empty || steps.load.outputs.withheld || steps.load.outputs.capture || (has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) && steps.alwaysLlm.outputs.matched) }}'
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: split
          inputs:
            text: ${{ steps.load.outputs.text }}
            repoDir: ${{ inputs.repoDir }}
      - name: match
        description: >-
          Try the turn against the recipes, through @puddleworks/recipes, before
          asking Jev anything. A hit is deterministic whatever Jev would say, so
          route, decide and search are skipped; a failure carries on to route.
          Skipped for an empty, withheld or capture: turn, a merged turn, a
          phrase on the alwaysLlm list and a yes confirm handled.
        dependsOn:
          - step: load
            condition:
              type: succeeded
          - step: alwaysLlm
            condition:
              type: always
          - step: merged
            condition:
              type: always
          - step: confirm
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ steps.load.outputs.empty || steps.load.outputs.withheld ||
          steps.load.outputs.capture ||
          (has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) && steps.alwaysLlm.outputs.matched) ||
          (has(steps.merged) && has(steps.merged.outputs) && steps.merged.outputs.matched) ||
          (has(steps.confirm) && has(steps.confirm.outputs) && (steps.confirm.outputs.action == "ran" || steps.confirm.outputs.action == "refused")) }}
        task:
          type: model_method
          modelIdOrName: recipes
          methodName: match
          inputs:
            text: ${{ steps.load.outputs.text }}
            repoDir: ${{ inputs.repoDir }}
      - name: route
        description: Ask Jev which route the turn should take. Skipped for an empty turn, for a turn that looks like it holds a secret (never sent to Jev), when the route cache already holds the answer, and for a merged turn, a turn sent with the capture prefix, a phrase on the alwaysLlm list, a turn a recipe matched or a yes confirm handled.
        dependsOn:
          - step: load
            condition:
              type: succeeded
          - step: alwaysLlm
            condition:
              type: always
          - step: match
            condition:
              type: always
          - step: recall
            condition:
              type: succeeded
          - step: merged
            condition:
              type: always
          - step: confirm
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: '${{ steps.load.outputs.empty || steps.load.outputs.withheld || steps.load.outputs.capture || steps.recall.outputs.hasRoute || (has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) && steps.alwaysLlm.outputs.matched) || (has(steps.match) && has(steps.match.outputs) && steps.match.outputs.matched) || (has(steps.merged) && has(steps.merged.outputs) && steps.merged.outputs.matched) || (has(steps.confirm) && has(steps.confirm.outputs) && (steps.confirm.outputs.action == "ran" || steps.confirm.outputs.action == "refused")) }}'
        task:
          type: model_method
          modelIdOrName: jev
          methodName: choice
          inputs:
            name: route
            state: ${{ steps.load.outputs.text }}
            instructions: >-
              Route this request typed into a coding assistant. Pick
              deterministic only if a program could answer it exactly by
              calling an API or CLI, with no judgement. Pick decision only if
              it asks for a yes/no judgement about text given in the request.
              Pick llm for anything else, such as writing, changing, reviewing
              or explaining code.
            criteria:
              deterministic: >-
                A program could answer it exactly by calling an API or CLI,
                with no judgement (list, count, look up, show status).
              decision: >-
                It asks for a yes/no judgement about text given in the request.
              llm: >-
                Anything else: writing, changing, reviewing, planning or
                explaining code or documents.
      - name: decide
        description: >-
          Ask Jev the yes/no question in the turn. Skipped unless the route is
          a decision at or above the cut-off (fresh or cached) and the turn is
          complete (nothing pasted, fenced or cut, so the text to judge is all
          there), when the route cache already holds the answer, and for a
          merged or capture: turn, a phrase on the alwaysLlm list, a turn a recipe
          matched or a yes confirm handled.
        dependsOn:
          - step: route
            condition:
              type: always
          - step: alwaysLlm
            condition:
              type: always
          - step: match
            condition:
              type: always
          - step: recall
            condition:
              type: succeeded
          - step: merged
            condition:
              type: always
          - step: confirm
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ steps.load.outputs.capture || steps.recall.outputs.hasDecision ||
          (has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) && steps.alwaysLlm.outputs.matched) ||
          (has(steps.match) && has(steps.match.outputs) && steps.match.outputs.matched) ||
          (has(steps.merged) && has(steps.merged.outputs) && steps.merged.outputs.matched) ||
          (has(steps.confirm) && has(steps.confirm.outputs) && (steps.confirm.outputs.action == "ran" || steps.confirm.outputs.action == "refused")) ||
          !(steps.load.outputs.complete &&
          ((steps.recall.outputs.hasRoute &&
          steps.recall.outputs.choice == "decision" &&
          steps.recall.outputs.confidence >= inputs.cutoff) ||
          (has(steps.route) && has(steps.route.outputs) &&
          steps.route.outputs.choice == "decision" &&
          steps.route.outputs.confidence >= inputs.cutoff))) }}
        task:
          type: model_method
          modelIdOrName: jev
          methodName: noul
          inputs:
            name: decide
            state: ${{ steps.load.outputs.text }}
            instructions: >-
              Answer the yes/no question asked in this request, judging only
              the text given in it.
            yes: The answer to the question is yes.
            no: The answer to the question is no.
      - name: search
        description: >-
          Search for extensions when no recipe matched a deterministic turn. If
          match failed it still runs, so the turn is not lost. A capture: turn
          always runs it (unless empty or withheld) and gets the request draft
          with no search. Skipped for a merged turn, a phrase on the alwaysLlm
          list or a yes confirm handled.
        dependsOn:
          - step: alwaysLlm
            condition:
              type: always
          - step: match
            condition:
              type: always
          - step: route
            condition:
              type: always
          - step: recall
            condition:
              type: succeeded
          - step: merged
            condition:
              type: always
          - step: confirm
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ (has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) && steps.alwaysLlm.outputs.matched) ||
          (has(steps.merged) && has(steps.merged.outputs) && steps.merged.outputs.matched) ||
          (has(steps.confirm) && has(steps.confirm.outputs) && (steps.confirm.outputs.action == "ran" || steps.confirm.outputs.action == "refused")) ||
          (steps.load.outputs.capture &&
          (steps.load.outputs.empty || steps.load.outputs.withheld)) ||
          (!steps.load.outputs.capture &&
          !((steps.recall.outputs.hasRoute &&
          steps.recall.outputs.choice == "deterministic" &&
          steps.recall.outputs.confidence >= inputs.cutoff) ||
          (has(steps.route) && has(steps.route.outputs) &&
          steps.route.outputs.choice == "deterministic" &&
          steps.route.outputs.confidence >= inputs.cutoff))) ||
          (has(steps.match) && has(steps.match.outputs) && steps.match.outputs.matched) }}
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: search
          inputs:
            text: ${{ steps.load.outputs.text }}
            sourceRef: ${{ steps.load.outputs.sourceRef }}
            repoDir: ${{ inputs.repoDir }}
            capture: ${{ steps.load.outputs.capture }}
      - name: pick
        description: >-
          Ask Jev which extension search found, if any, can answer the turn.
          Skipped unless search found candidates, and when the route cache
          already holds the pick.
        dependsOn:
          - step: search
            condition:
              type: always
          - step: recall
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
        guard: >-
          ${{ steps.recall.outputs.hasPick || !(has(steps.search) &&
          has(steps.search.outputs) &&
          steps.search.outputs.kind == "candidates") }}
        task:
          type: model_method
          modelIdOrName: jev
          methodName: choice
          inputs:
            name: pick
            state: ${{ steps.load.outputs.text }}
            instructions: >-
              Pick the extension that can answer this request exactly by
              calling an API or CLI. Pick none if no candidate can.
            criteria: ${{ steps.search.outputs.criteria }}
      - name: execute
        description: >-
          Run the matched recipe, through @puddleworks/recipes, or show its plan
          if it makes changes. Skipped unless match found a recipe.
        dependsOn:
          - step: match
            condition:
              type: always
        weight: 0
        allowFailure: true
        guard: >-
          ${{ !(has(steps.match) && has(steps.match.outputs) &&
          steps.match.outputs.matched) }}
        task:
          type: model_method
          modelIdOrName: recipes
          methodName: execute
          inputs:
            recipeId: ${{ steps.match.outputs.recipeId }}
            captures: ${{ steps.match.outputs.captures }}
            repoDir: ${{ inputs.repoDir }}
            sessionId: ${{ inputs.sessionId }}
            mode: ${{ inputs.mode }}
      - name: raise
        description: >-
          Log one request in Capture as a draft, through
          @puddleworks/capture-log-request, for a deterministic turn that no
          recipe or allowlisted extension can answer, or for a capture: turn.
          The turn's sourceRef is
          the Idempotency-Key, so the same turn gives the same request. Live
          mode only, so shadow mode has no side effects.
        dependsOn:
          - step: search
            condition:
              type: always
          - step: pick
            condition:
              type: always
          - step: recall
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
        guard: >-
          ${{ !(inputs.mode == "live" && has(steps.search) &&
          has(steps.search.outputs) &&
          !(steps.search.outputs.kind == "candidates" &&
          ((steps.recall.outputs.hasPick &&
          steps.recall.outputs.pickChoice != "none" &&
          steps.recall.outputs.pickConfidence >= inputs.cutoff) ||
          (has(steps.pick) && has(steps.pick.outputs) &&
          steps.pick.outputs.choice != "none" &&
          steps.pick.outputs.confidence >= inputs.cutoff)))) }}
        task:
          type: workflow
          workflowIdOrName: "@puddleworks/capture-log-request"
          inputs:
            title: ${{ steps.search.outputs.requestTitle }}
            description: ${{ steps.search.outputs.requestDescription }}
            sourceRef: ${{ steps.search.outputs.requestKey }}
            phrase: ${{ steps.search.outputs.requestPhrase }}
            candidateExtensions: ${{ steps.search.outputs.requestCandidates }}
            requester: ${{ steps.search.outputs.requestRequester }}
      - name: reply
        description: Store what the hook should do. Runs whether or not Jev answered.
        dependsOn:
          - step: load
            condition:
              type: succeeded
          - step: recall
            condition:
              type: succeeded
          - step: alwaysLlm
            condition:
              type: always
          - step: confirm
            condition:
              type: always
          - step: merged
            condition:
              type: always
          - step: route
            condition:
              type: always
          - step: decide
            condition:
              type: always
          - step: match
            condition:
              type: always
          - step: search
            condition:
              type: always
          - step: pick
            condition:
              type: always
          - step: execute
            condition:
              type: always
          - step: raise
            condition:
              type: always
        weight: 0
        allowFailure: false
        task:
          type: model_method
          modelIdOrName: puddlerouter
          methodName: reply
          inputs:
            mode: ${{ inputs.mode }}
            cutoff: ${{ inputs.cutoff }}
            answerCutoff: ${{ inputs.answerCutoff }}
            complete: ${{ steps.load.outputs.complete }}
            hookStartedAt: ${{ inputs.hookStartedAt }}
            sourceRef: ${{ steps.load.outputs.sourceRef }}
            capture: ${{ steps.load.outputs.capture }}
            alwaysLlm: "${{ has(steps.alwaysLlm) && has(steps.alwaysLlm.outputs) ? steps.alwaysLlm.outputs.matched : false }}"
            recalled: ${{ steps.recall.outputs }}
            choice: '${{ has(steps.route) && has(steps.route.outputs) ? steps.route.outputs.choice : "" }}'
            confidence: "${{ has(steps.route) && has(steps.route.outputs) ? steps.route.outputs.confidence : 0.0 }}"
            yes: "${{ has(steps.decide) && has(steps.decide.outputs) ? steps.decide.outputs.noul : null }}"
            matchKind: '${{ has(steps.match) && has(steps.match.outputs) && steps.match.outputs.matched ? "recipe" : (has(steps.search) && has(steps.search.outputs) ? steps.search.outputs.kind : "none") }}'
            recipeId: '${{ has(steps.match) && has(steps.match.outputs) && steps.match.outputs.matched ? steps.match.outputs.recipeId : "" }}'
            candidates: "${{ has(steps.search) && has(steps.search.outputs) ? steps.search.outputs.candidates : [] }}"
            resultAction: '${{ has(steps.execute) && has(steps.execute.outputs) ? steps.execute.outputs.action : "" }}'
            resultOk: "${{ has(steps.execute) && has(steps.execute.outputs) ? steps.execute.outputs.ok : false }}"
            resultText: '${{ has(steps.execute) && has(steps.execute.outputs) ? steps.execute.outputs.text : "" }}'
            confirmAction: '${{ has(steps.confirm) && has(steps.confirm.outputs) ? steps.confirm.outputs.action : "" }}'
            confirmOk: "${{ has(steps.confirm) && has(steps.confirm.outputs) ? steps.confirm.outputs.ok : false }}"
            confirmText: '${{ has(steps.confirm) && has(steps.confirm.outputs) ? steps.confirm.outputs.text : "" }}'
            confirmError: '${{ has(steps.confirm) && has(steps.confirm.outputs) ? steps.confirm.outputs.error : "" }}'
            confirmRecipeId: '${{ has(steps.confirm) && has(steps.confirm.outputs) ? steps.confirm.outputs.recipeId : "" }}'
            pickChoice: '${{ has(steps.pick) && has(steps.pick.outputs) ? steps.pick.outputs.choice : "" }}'
            pickConfidence: "${{ has(steps.pick) && has(steps.pick.outputs) ? steps.pick.outputs.confidence : 0.0 }}"
            requestUrl: '${{ has(steps.raise) && has(steps.raise.outputs) ? inputs.captureUrl + "/requests/" + steps.raise.outputs["create-request"].id : "" }}'
            mergedMatched: "${{ has(steps.merged) && has(steps.merged.outputs) ? steps.merged.outputs.matched : false }}"
            mergedOk: "${{ has(steps.merged) && has(steps.merged.outputs) ? steps.merged.outputs.ok : false }}"
            mergedText: '${{ has(steps.merged) && has(steps.merged.outputs) ? steps.merged.outputs.text : "" }}'
            mergedSummary: '${{ has(steps.merged) && has(steps.merged.outputs) ? steps.merged.outputs.summary : "" }}'
            mergedError: '${{ has(steps.merged) && has(steps.merged.outputs) ? steps.merged.outputs.error : "" }}'
