# Copy to puddlerouter.yaml in the runtime repo (that file is gitignored).
# A bad entry is dropped and logged; the rest of the file still applies.

# Extension scopes or names to trust, on top of the defaults
# (@swamp/*, @mesgme/*, @webframp/*, @puddleworks/*).
allow:
  - "@webframp/*"

# Methods you know only read, so their recipes answer at once: "extension method".
# Any other method asks first and shows its plan, because the router cannot tell
# what it changes. A pack cannot set this: only this file can.
reads:
  - "@webframp/github list_prs"
  - "@webframp/github list_workflows"
  # The name swamp runs, so Capture's type (needs @puddleworks/recipes 2026.11.10.1).
  - "@puddleworks/capture/requests list_requests"
  - "@puddleworks/puddlerouter stats"

# Who Capture requests are logged for: your email, as in Capture's people list.
# Unset, Intake Bot owns them. If Capture doesn't know the email, nothing is logged.
# requester: you@example.com

# Phrases that must always go to Claude, with no Jev call. Each is a regular
# expression, case-insensitive, tried against the typed text with pasted and
# fenced blocks taken out. It need not match the whole turn: use ^ for the start.
# A hit beats a cached route and a matching recipe. A capture: turn is still logged.
alwaysLlm:
  - '^load the handover doc\b'

# Your own recipes, tried before those from packs. The turn must match `pattern`
# in full, and each captured piece must have the declared shape (int, repo or
# word) before it becomes a method input. @puddleworks/recipes reads these.
recipes:
  - id: github-open-prs
    extension: "@webframp/github"
    method: list_prs
    definition: github
    # {repo} and {state} are inputs; "/" becomes "-" (the data is prs-owner-repo-open).
    dataName: "prs-{repo}-{state}"
    pattern: '^(?:list |show )?open (?:prs|pull requests) (?:in|for) ([\w.-]+/[\w.-]+)[?.!]?$'
    inputs:
      repo: { capture: 1, as: repo }
    fixed:
      state: open
    each:
      path: pullRequests
      line: "#{number} {title}"
    template: "{count} open pull requests:\n{lines}"
    empty: "No open pull requests."
    # Optional: reuse a successful answer for this long (30s, 5m, 1h). Default none.
    cacheFor: 5m

  # The Capture requests you are on, such as the ones the router raised for you.
  # Capture lists only requests the person acting is on, so `as` must be the
  # same email as `requester:` above; Intake Bot is not on the ones it logs.
  - id: capture-raised-requests
    extension: "@puddleworks/capture/requests"
    method: list_requests
    definition: capture
    dataName: requests-mine-all
    pattern: '^(?:(?:list|show)(?: me)? )?(?:my (?:capture |raised )?requests|(?:the )?(?:capture|raised) requests|what (?:requests )?(?:have i|did i) raise[d]?)[?.!]?$'
    fixed:
      as: you@example.com
      scope: mine
    each:
      path: items
      line: "#{number} {title}: {status}"
    template: "Your Capture requests ({count}):\n{lines}"
    empty: "You are on no Capture requests."

  # The router's own shadow log: turns, routes and actions of the last week.
  - id: router-stats
    extension: "@puddleworks/puddlerouter"
    method: stats
    definition: puddlerouter
    dataName: stats
    pattern: '^(?:(?:show|what are)(?: me)? )?(?:the )?(?:puddle)?router (?:stats|statistics)[?.!]?$'
    fixed:
      days: "7"
    template: "puddlerouter, last {days} days: {turns} turns ({modeSplit}).\nRoutes: {routeSplit}.\nDid or would: {actionSplit}.\nAnswered by a recipe: {recipeTurns}.\nDelay: {delay}."
